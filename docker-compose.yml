services:
  mysql:
    image: mysql:8.4
    container_name: chapi-mysql
    restart: unless-stopped
    ports:
      # Host 3307 to avoid clashing with other local MySQL instances on 3306.
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chapi
      MYSQL_USER: chapi
      MYSQL_PASSWORD: chapi
    volumes:
      - chapi-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uchapi", "-pchapi"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  chapi-mysql-data:
